[project]
name = "medswarm"
version = "0.1.0"
description = "Distilling a parallel multi-agent orchestrator into a small Qwen model on MedCalc-Bench"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "openai",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]
train = ["torch", "transformers>=5", "trl>=1.18", "peft", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medswarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
